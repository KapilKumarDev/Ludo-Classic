<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1810">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Ludo — Game</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/game.css">
<link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="css/home.css" as="style">
<link rel="prefetch" href="js/home.js" as="script">
<script defer blocking="render" src="js/constants.js"></script>
<script defer blocking="render" src="js/storage.js"></script>
<script defer blocking="render" src="js/state.js"></script>
<script defer blocking="render" src="js/game-state.js"></script>
<script defer blocking="render" src="js/rules.js"></script>
<script defer blocking="render" src="js/ai.js"></script>
<script defer blocking="render" src="js/board.js"></script>
<script defer blocking="render" src="js/hud.js"></script>
<script defer blocking="render" src="js/turn.js"></script>
<script defer blocking="render" src="js/game.js"></script>
</head>
<body>

<main id="game" class="screen">
  <button type="button" class="back-btn" id="quitBtn">← Exit</button>
  <p class="turn-title" id="turnTitle" role="status"></p>
  <div class="arena">
    <div class="table">
      <div class="dice-slot tl"></div>
      <div class="dice-slot tr"></div>
      <div class="board-wrap"><div class="board" id="board" role="group" aria-label="Game board"></div></div>
      <div class="dice-slot bl"></div>
      <div class="dice-slot br"></div>
    </div>
  </div>
</main>

<div class="winner-overlay" id="winnerOverlay" role="dialog" aria-modal="true" aria-labelledby="winnerText" hidden>
  <h2 id="winnerText"></h2>
  <button type="button" class="cream-btn" id="playAgainBtn">Play again</button>
  <a class="ghost-btn" href="index.html">Main menu</a>
</div>

<dialog class="quit-dialog" id="quitDialog" aria-labelledby="quitTitle">
  <h2 id="quitTitle">Leave this game?</h2>
  <p>Your progress will be lost.</p>
  <div class="dialog-actions">
    <button type="button" class="cream-btn" id="stayBtn">Keep playing</button>
    <button type="button" class="ghost-btn" id="leaveBtn">Leave game</button>
  </div>
</dialog>

</body>
</html>
