<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="home" class="screen active">
  <div class="home-title">LUDO</div>
  <a class="settings-link" href="settings.html"><span class="settings-icon" aria-hidden="true">⚙︎</span>Settings</a>
  <button class="home-panel computer" data-mode="computer">
    <div class="icon">♟</div>
    <div class="label">Vs Computer</div>
    <div class="sub">Play against AI opponents</div>
  </button>
  <button class="home-panel local" data-mode="local">
    <div class="icon">◈</div>
    <div class="label">Local</div>
    <div class="sub">Pass and play with friends</div>
  </button>
</div>

<script src="js/constants.js"></script>
<script src="js/storage.js"></script>
<script src="js/state.js"></script>
<script src="js/home.js"></script>
</body>
</html>
