<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Ludo — Setup</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/setup.css">
<link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="prefetch" href="game.html">
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="css/game.css" as="style">
<link rel="prefetch" href="css/home.css" as="style">
<link rel="prefetch" href="js/game-state.js" as="script">
<link rel="prefetch" href="js/rules.js" as="script">
<link rel="prefetch" href="js/ai.js" as="script">
<link rel="prefetch" href="js/board.js" as="script">
<link rel="prefetch" href="js/hud.js" as="script">
<link rel="prefetch" href="js/turn.js" as="script">
<link rel="prefetch" href="js/game.js" as="script">
<link rel="prefetch" href="js/home.js" as="script">
<script defer blocking="render" src="js/constants.js"></script>
<script defer blocking="render" src="js/storage.js"></script>
<script defer blocking="render" src="js/state.js"></script>
<script defer blocking="render" src="js/setup.js"></script>
</head>
<body>

<main id="setup" class="screen">
  <a class="back-btn" href="index.html">← Back</a>
  <div class="count-row" id="countRow" role="group" aria-label="Number of players">
    <button type="button" class="count-opt" data-count="2">2</button>
    <button type="button" class="count-opt" data-count="3">3</button>
    <button type="button" class="count-opt" data-count="4">4</button>
  </div>
  <button type="button" class="team-toggle" id="teamToggle" hidden></button>
  <div class="lineup" id="lineup"></div>
  <button type="button" class="cream-btn setup-start" id="startGameBtn">Start game</button>
</main>

</body>
</html>
